  /summary:
    post:
      operationId: summarizeForUnderwriter
      tags:
      - llm
      summary: Сводка для андеррайтера
      description: '3–5 выводов для карточки андеррайтера. Backend сохраняет результат вместе с `llm.*` в своей БД; публичный GET дополнительно возвращает `status` и `generatedAt`. При `LLM_SUMMARY_ENABLED=true` (вместе с `LLM_ENABLED`) и
        непустом `facts` выводы пишет LLM: у каждого должны быть ссылки на переданные факты, выводы без них и ссылки на чужие факты отбрасываются. LLM недоступна,
        не уложилась в `LLM_TIMEOUT_SECONDS` или ответила не по формату — шаблон: вилка относительно порога, открытые пятна
        по убыванию цены, факты без пятна по источникам (`generatedBy = TEMPLATE`). Решение LLM не предлагает.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SummaryRequest'
            examples:
              builder:
                summary: ИП Петров на андеррайтинге — шаблонная сводка (LLM выключена)
