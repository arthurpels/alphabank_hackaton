    post:
      operationId: detectAnomalies
      tags:
      - scoring
      summary: Аномалии в помесячных рядах выручки
      description: Падение месяц к месяцу больше 30 % — `REVENUE_DROP`, рост больше чем в 3 раза — `REVENUE_SPIKE`. Каждая
        аномалия — готовое пятно `ANOMALY` по фактору `revenue_stability`. Пустой список — аномалий нет, бэкенд передаёт в
        `/score` `stability = CLEAN`. Точки ряда сортируются по месяцу; сравниваются только соседние календарные месяцы
        (через пропуск — нет), месяц с нулевой выручкой базой для сравнения не служит. Повтор месяца в ряду — 422. Пороги и
        тексты — в `ml/scoring_rules.yaml`, раздел `anomalies`.
