        anomalies:
          type: array
          items:
            $ref: '#/components/schemas/Anomaly'
    ValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            type: object
            properties:
              loc:
                type: array
                items:
                  oneOf:
                  - type: string
                  - type: integer
              msg:
                type: string
              type:
                type: string
    PurposeRequest:
      type: object
      required:
      - productCode
      properties:
        productCode:
          $ref: '#/components/schemas/ProductCode'
        goal:
          type: string
