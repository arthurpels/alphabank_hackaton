  /health/llm:
    get:
      operationId: llmHealth
      tags:
      - llm
      summary: Состояние локальной LLM
      description: '`disabled` — LLM выключена (`LLM_ENABLED=false`); `warming` — модель загружается в память после старта;
        `ready` — модель на месте (digest совпал) и прогрета; `unavailable` — Ollama не отвечает, модели нет или digest не
        совпал, прогрев повторяется каждые 10 секунд. `cachedVerdicts` — сколько ответов LLM запомнено (M02).'
      responses:
        '200':
          description: состояние
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmHealth'
              examples:
                disabled:
                  summary: LLM выключена
                  value:
                    status: disabled
                    model: null
                    digest: null
                    cachedVerdicts: null
                ready:
                  summary: модель прогрета, 12 ответов запомнено
                  value:
                    status: ready
                    model: qwen3:4b
                    digest: 359d7dd4bcdab3d86b87d73ac27966f4dbb9f5efdfcc75d34a8764a09474fae7
                    cachedVerdicts: 12
  /health:
    get:
      operationId: health
      tags:
      - scoring
      summary: Проверка для healthcheck в compose и версии движка
      description: '`engineVersion` — первые 12 символов sha256 от кода движка (`scoring/engine.py`, `conditions.py`,
        `schemas.py`) и `scoring_rules.yaml`: меняется при любой правке формул или правил. Бэкенд пишет её в снимок вилки
        (M06), чтобы было видно, каким движком посчитана вилка.'
      responses:
        '200':
          description: сервис жив
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - engineVersion
                - rulesVersion
                properties:
                  status:
                    type: string
                    example: ok
                  engineVersion:
                    type: string
                    example: 3f9c1a2b7d4e
                  rulesVersion:
                    type: string
                    example: 2026-10-26.draft2
  /rules:
    get:
      operationId: rules
      tags:
      - scoring
      summary: Публичное представление правил скоринга
      description: Продукты, факторы, пороги и стоп-факторы из действующей версии YAML-правил. Суммы указаны в копейках.
      responses:
        '200':
          description: действующие правила
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulesResponse'
              examples:
                current:
                  summary: Действующая версия правил
                  value:
                    rulesVersion: 2026-10-26.draft2
                    calcRatePct: 20.0
                    products:
                    - code: EQUIPMENT
                      name: Кредит на оборудование
                      baseRate: 22.0
                      thresholds:
                        approveMax: 20.0
                        rejectMin: 24.0
                      amount:
                        min: 30000000
                        max: 1000000000
                      terms: [12, 24, 36]
                      policy:
                        metric: PTI
                        cap: 0.3
                      skipFactors: []
                    - code: WORKING_CAPITAL
                      name: Кредит на пополнение оборотных средств
                      baseRate: 20.0
                      thresholds:
                        approveMax: 21.0
                        rejectMin: 25.0
                      amount:
                        min: 10000000
                        max: 1000000000
                      terms: [6, 12, 24, 36]
                      policy:
                        metric: PTI
                        cap: 0.3
                      skipFactors: []
                    - code: OVERDRAFT
                      name: Овердрафт для бизнеса
                      baseRate: 21.0
                      thresholds:
                        approveMax: 22.0
                        rejectMin: 26.0
                      amount:
                        min: 5000000
                        max: 300000000
                      terms: [3, 6, 12]
                      policy:
                        metric: LIMIT_SHARE
                        cap: 0.3
                      skipFactors: [purpose, collateral]
                    factors:
                    - code: credit_history
                      title: Кредитная история
                      unknown: null
                      rules:
                      - condition: delinquencies_12m > 0 or credit_score < 500
                        value: 2.0
                      - condition: credit_score >= 700
                        value: -1.0
                      - condition: credit_score >= 600
                        value: 0.0
                      - condition: null
                        value: 1.0
                      overdraftRules: []
                    - code: business_age
                      title: Возраст бизнеса
                      unknown: null
                      rules:
                      - condition: age_months < 12
                        value: 1.5
                      - condition: age_months < 36
                        value: 0.5
                      - condition: null
                        value: -0.5
                      overdraftRules: []
                    - code: tax_discipline
                      title: Налоговая дисциплина
                      unknown: null
                      rules:
                      - condition: unfiled_reports > 0
                        value: 1.0
                      - condition: null
                        value: 0.0
                      overdraftRules: []
                    - code: debt_load
                      title: Подтверждённая выручка и долговая нагрузка
                      unknown:
                        best: -1.5
                        worst: 2.0
                        spotPricePp: 3.5
                      rules:
                      - condition: pti <= 0.05
                        value: -1.5
                      - condition: pti <= 0.10
                        value: -0.5
                      - condition: pti <= 0.25
                        value: 0.5
                      - condition: null
                        value: 1.5
                      overdraftRules:
                      - condition: limit_share <= 0.15
                        value: -0.5
                      - condition: null
                        value: 0.5
                    - code: revenue_stability
                      title: Стабильность выручки
                      unknown:
                        best: 0.0
                        worst: 2.5
                        spotPricePp: 2.5
                      rules:
                      - condition: series and no_anomalies
                        value: 0.0
                      - condition: anomaly_explained_accepted
                        value: 0.0
                      - condition: only_document
                        value: 1.0
                      - condition: anomaly_explanation_rejected
                        value: 2.5
                      overdraftRules: []
                    - code: purpose
                      title: Цель кредита
                      unknown:
                        best: -0.5
                        worst: 1.0
                        spotPricePp: 1.5
                      rules:
                      - condition: purpose_matches_product
                        value: -0.5
                      - condition: null
                        value: 0.5
                      overdraftRules: []
                    - code: collateral
                      title: Обеспечение
                      unknown:
                        best: -1.5
                        worst: 0.0
                        spotPricePp: 1.5
                      rules:
                      - condition: guarantee_or_pledge
                        value: -1.5
                      - condition: null
                        value: 0.0
                      overdraftRules: []
                    stopFactors:
                    - code: LIQUIDATION
                      condition: egrul.status != 'ACTIVE'
                      removable: false
                      closeMethod: null
                    - code: YOUNG_BUSINESS
                      condition: age_months < 6
                      removable: false
                      closeMethod: null
                    - code: NEW_DIRECTOR
                      condition: director_months < 3
                      removable: false
                      closeMethod: null
                    - code: MASS_ADDRESS
                      condition: egrul.address.is_mass
                      removable: false
                      closeMethod: null
                    - code: TAX_DEBT
                      condition: fns.tax_debt.amount > 0
                      removable: true
                      closeMethod: PAY
                    - code: BKI_OVERDUE
                      condition: bki.delinquencies.current > 0
                      removable: false
                      closeMethod: null
components:
  responses:
    ValidationError:
      description: некорректный вход (стандартный ответ FastAPI)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
  schemas:
    ProductCode:
      type: string
      enum:
      - WORKING_CAPITAL
      - EQUIPMENT
      - OVERDRAFT
    SourceCode:
      type: string
      enum:
      - BKI
      - EGRUL
      - FNS
      - OFD
      - MARKETPLACE
      - ACQUIRING
      - REPUTATION
    FactorCode:
      type: string
      enum:
      - credit_history
      - business_age
      - tax_discipline
      - debt_load
      - revenue_stability
      - purpose
      - collateral
    StopFactorCode:
      type: string
      enum:
      - LIQUIDATION
      - YOUNG_BUSINESS
      - NEW_DIRECTOR
      - MASS_ADDRESS
      - TAX_DEBT
      - BKI_OVERDUE
    Stability:
      type: string
      nullable: true
      description: '`null` — рядов нет, фактор неизвестен; `ANOMALY_OPEN` — аномалия найдена, ответа нет (тоже неизвестен);
        `CLEAN` — аномалий нет; `EXPLAINED` — объяснение принято; `DOCUMENT` — выручка подтверждена только договором; `REJECTED`
        — объяснение отклонено.'
      enum:
      - CLEAN
      - ANOMALY_OPEN
      - EXPLAINED
      - DOCUMENT
      - REJECTED
      - null
    Purpose:
      type: string
      nullable: true
      description: '`null` — цель не описана; `MATCH` — цель соответствует продукту; `MISMATCH` — не соответствует.'
      enum:
      - MATCH
      - MISMATCH
      - null
    Collateral:
      type: string
      nullable: true
      description: '`null` — клиент ещё не решил; `GUARANTEE` / `PLEDGE` — поручительство или залог; `DECLINED` — отказался.'
      enum:
      - GUARANTEE
      - PLEDGE
      - DECLINED
      - null
    ScoreRequest:
      type: object
      required:
      - asOf
      - productCode
      - amount
      - termMonths
      - egrulStatus
      - registeredAt
      - directorSince
      - massAddress
      - creditScore
      - delinq12m
      - bkiCurrentOverdue
      - taxDebt
      - unfiledReports
      properties:
        asOf:
          type: string
          format: date
          description: 'дата расчёта: от неё считаются возраст бизнеса и срок директора'
        productCode:
          $ref: '#/components/schemas/ProductCode'
        amount:
          type: integer
          format: int64
          minimum: 1
          description: сумма, копейки
        termMonths:
          type: integer
          minimum: 1
        egrulStatus:
          type: string
          description: ЕГРЮЛ `status`
          example: ACTIVE
        registeredAt:
          type: string
          format: date
          description: ЕГРЮЛ `registered_at`
        directorSince:
          type: string
          format: date
          description: ЕГРЮЛ `director.appointed_at`
        massAddress:
          type: boolean
          description: ЕГРЮЛ `address.is_mass`
        creditScore:
          type: integer
          description: БКИ `credit_score`
        delinq12m:
          type: integer
          minimum: 0
          description: БКИ `delinquencies.last_12m`
        bkiCurrentOverdue:
          type: integer
          minimum: 0
          description: БКИ `delinquencies.current`
        taxDebt:
          type: integer
          format: int64
          minimum: 0
          description: ФНС `tax_debt.amount`, копейки
        unfiledReports:
          type: integer
          minimum: 0
          description: ФНС `unfiled_reports`
        monthlyRevenue:
          type: integer
          format: int64
          nullable: true
          minimum: 1
          description: 'среднемесячная подтверждённая выручка, копейки: ОФД `revenue`, маркетплейс `payout`, эквайринг `turnover`
            или договор (сумма / срок); при нескольких источниках — максимум. `null` — выручка не подтверждена, 0 не передаём'
        stability:
          $ref: '#/components/schemas/Stability'
        purpose:
          $ref: '#/components/schemas/Purpose'
        collateral:
          $ref: '#/components/schemas/Collateral'
        bankPayment:
          type: integer
          format: int64
          minimum: 0
          default: 0
          description: 'платежи по действующим кредитам нашего банка, копейки в месяц: бэкенд суммирует платежи по договорам
            заявок компании в статусах `SIGNING` и `ISSUED`. Входят в нагрузку вместе с платежом по новому кредиту'
        bkiCredits:
          type: array
          default: []
          description: 'открытые кредиты из БКИ (`open_credits`) с ненулевым остатком. Платежа и срока в БКИ нет, поэтому платёж
            оценивается условно по правилам `existing_obligations` (`ml/scoring_rules.yaml`): по кредитам с графиком — аннуитет
            на остаток за `term_loan_months` по расчётной ставке, по карте и овердрафту — `revolving_share` от остатка в месяц.
            Для продукта-овердрафта (метрика «лимит / выручка») не учитываются'
          items:
            $ref: '#/components/schemas/BkiCredit'
    BkiCredit:
      type: object
      required:
      - type
      - debt
      properties:
        type:
          type: string
          description: БКИ `open_credits[].type`, например `LOAN`, `CREDIT_CARD`, `OVERDRAFT`
          example: LOAN
        debt:
          type: integer
          format: int64
          minimum: 0
          description: БКИ `open_credits[].debt`, текущий остаток, копейки
          example: 15000000
    Thresholds:
      type: object
      required:
      - approveMax
      - rejectMin
      properties:
        approveMax:
          type: number
          description: правый край ≤ — автоодобрение
        rejectMin:
          type: number
          description: левый край ≥ — отказ
    Factor:
      type: object
      required:
      - code
      - title
      - applicable
      - known
      properties:
        code:
          $ref: '#/components/schemas/FactorCode'
        title:
          type: string
        applicable:
          type: boolean
          description: false — фактор не применяется к продукту (у овердрафта `purpose` и `collateral`)
        known:
          type: boolean
        value:
          type: number
          nullable: true
          description: вклад, п.п., если фактор известен
        best:
          type: number
          nullable: true
          description: лучший вклад, если фактор неизвестен
        worst:
          type: number
          nullable: true
          description: худший вклад, если фактор неизвестен
        spotPricePp:
          type: number
          nullable: true
          description: цена пятна = worst − best
    StopFactor:
      type: object
      required:
      - code
      - removable
      properties:
        code:
          $ref: '#/components/schemas/StopFactorCode'
        removable:
          type: boolean
        closeMethod:
          type: string
          nullable: true
          enum:
          - PAY
          - null
          description: как клиент устраняет; `null` у неустранимого
    Policy:
      type: object
      required:
      - amountInRange
      - ok
      properties:
        metric:
          type: string
          nullable: true
          enum:
          - PTI
          - LIMIT_SHARE
          - null
          description: '`PTI` — (платёж по новому кредиту + платежи по действующим) / выручка; `LIMIT_SHARE` — лимит овердрафта / выручка; `null` — выручка неизвестна'
        value:
          type: number
          nullable: true
          description: доля, например 0.347
        cap:
          type: number
          nullable: true
          description: допустимая доля продукта
        existingPayment:
          type: integer
          format: int64
          minimum: 0
          description: 'платежи по действующим кредитам, которые вошли в `value`, копейки в месяц (кредиты банка и оценка
            по БКИ); 0 — обязательств нет или метрика продукта их не учитывает (`LIMIT_SHARE`)'
        amountInRange:
          type: boolean
        ok:
          type: boolean
    ScoreResponse:
      type: object
      required:
      - rulesVersion
      - productCode
      - rateFrom
      - rateTo
      - thresholds
      - factors
      - stopFactors
      - policy
      - passes
      properties:
        rulesVersion:
          type: string
          description: версия YAML-правил — пишется в FORK_SNAPSHOT и DECISION
        productCode:
          $ref: '#/components/schemas/ProductCode'
        rateFrom:
          type: number
          description: левый край, %
        rateTo:
          type: number
          description: правый край, %
        thresholds:
          $ref: '#/components/schemas/Thresholds'
        factors:
          type: array
          items:
            $ref: '#/components/schemas/Factor'
        stopFactors:
          type: array
          items:
            $ref: '#/components/schemas/StopFactor'
        policy:
          $ref: '#/components/schemas/Policy'
        passes:
          type: boolean
          description: policy.ok и rateTo ≤ approveMax
    RulesResponse:
      type: object
      required:
      - rulesVersion
      - calcRatePct
      - products
      - factors
      - stopFactors
      properties:
        rulesVersion:
          type: string
        calcRatePct:
          type: number
          description: расчётная ставка для платежа, %
        products:
          type: array
          items:
            $ref: '#/components/schemas/RulesProduct'
        factors:
          type: array
          items:
            $ref: '#/components/schemas/RulesFactor'
        stopFactors:
          type: array
          items:
            $ref: '#/components/schemas/RulesStopFactor'
    RulesProduct:
      type: object
      required:
      - code
      - name
      - baseRate
      - thresholds
      - amount
      - terms
      - policy
      - skipFactors
      properties:
        code:
          $ref: '#/components/schemas/ProductCode'
        name:
          type: string
        baseRate:
          type: number
          description: базовая ставка, %
        thresholds:
          $ref: '#/components/schemas/Thresholds'
        amount:
          $ref: '#/components/schemas/RulesAmount'
        terms:
          type: array
          items:
            type: integer
            minimum: 1
          description: доступные сроки, месяцы
        policy:
          $ref: '#/components/schemas/RulesPolicy'
        skipFactors:
          type: array
          items:
            $ref: '#/components/schemas/FactorCode'
    RulesAmount:
      type: object
      required:
      - min
      - max
      properties:
        min:
          type: integer
          format: int64
          minimum: 1
          description: минимальная сумма, копейки
        max:
          type: integer
          format: int64
          minimum: 1
          description: максимальная сумма, копейки
    RulesPolicy:
      type: object
      required:
      - metric
      - cap
      properties:
        metric:
          type: string
          enum:
          - PTI
          - LIMIT_SHARE
        cap:
          type: number
          description: допустимая доля продукта
    RulesUnknown:
      type: object
      required:
      - best
      - worst
      - spotPricePp
      properties:
        best:
          type: number
          description: лучший вклад неизвестного фактора, п.п.
        worst:
          type: number
          description: худший вклад неизвестного фактора, п.п.
        spotPricePp:
          type: number
          description: цена пятна = worst − best
    RulesRule:
      type: object
      required:
      - condition
      - value
      properties:
        condition:
          type: string
          nullable: true
          description: условие правила; null — правило по умолчанию
        value:
          type: number
          description: вклад фактора, п.п.
    RulesFactor:
      type: object
      required:
      - code
      - title
      - unknown
      - rules
      - overdraftRules
      properties:
        code:
          $ref: '#/components/schemas/FactorCode'
        title:
          type: string
        unknown:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/RulesUnknown'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RulesRule'
        overdraftRules:
          type: array
          items:
            $ref: '#/components/schemas/RulesRule'
    RulesStopFactor:
      type: object
      required:
      - code
      - condition
      - removable
      - closeMethod
      properties:
        code:
          $ref: '#/components/schemas/StopFactorCode'
        condition:
          type: string
        removable:
          type: boolean
        closeMethod:
          type: string
          nullable: true
          enum:
          - PAY
          - null
    Offer:
      type: object
      required:
      - productCode
      - amount
      - termMonths
      - rateFrom
      - rateTo
      - policy
      properties:
        productCode:
          $ref: '#/components/schemas/ProductCode'
        amount:
          type: integer
          format: int64
          description: копейки
        termMonths:
          type: integer
        collateralType:
          type: string
          nullable: true
          enum:
          - GUARANTEE
          - null
          description: '`null` — без обеспечения'
        rateFrom:
          type: number
        rateTo:
          type: number
        policy:
          $ref: '#/components/schemas/Policy'
    OfferGridResponse:
      type: object
      required:
      - rulesVersion
      - offers
      properties:
        rulesVersion:
          type: string
        offers:
          type: array
          items:
            $ref: '#/components/schemas/Offer'
    SeriesPoint:
      type: object
      required:
      - month
      - value
      properties:
        month:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
          example: 2026-03
        value:
          type: integer
          format: int64
          minimum: 0
          description: копейки
    Series:
      type: object
      required:
      - source
      - points
      properties:
        source:
          $ref: '#/components/schemas/SourceCode'
        points:
          type: array
          items:
            $ref: '#/components/schemas/SeriesPoint'
    AnomaliesRequest:
      type: object
      required:
      - series
      properties:
        series:
          type: array
          items:
            $ref: '#/components/schemas/Series'
    AnswerOption:
      type: object
      required:
      - code
      - label
      properties:
        code:
          type: string
        label:
          type: string
    Anomaly:
      type: object
      required:
      - code
      - source
      - month
      - changePct
      - title
      - clientHint
      - answerOptions
      properties:
        code:
          type: string
          enum:
          - REVENUE_DROP
          - REVENUE_SPIKE
        source:
          $ref: '#/components/schemas/SourceCode'
        month:
          type: string
          pattern: ^\d{4}-\d{2}$
        changePct:
          type: integer
          description: изменение к прошлому месяцу, %, округлено до целого (половина — от нуля)
        title:
          type: string
          description: заголовок пятна для клиента
        clientHint:
          type: string
        answerOptions:
          type: array
          items:
            $ref: '#/components/schemas/AnswerOption'
    AnomaliesResponse:
      type: object
      required:
      - anomalies
      properties:
        anomalies:
          type: array
          items:
            $ref: '#/components/schemas/Anomaly'
    ValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            type: object
            properties:
              loc:
                type: array
                items:
                  oneOf:
                  - type: string
                  - type: integer
              msg:
                type: string
              type:
                type: string
    PurposeRequest:
      type: object
      required:
      - productCode
      properties:
        productCode:
          $ref: '#/components/schemas/ProductCode'
        goal:
          type: string
          nullable: true
          maxLength: 1000
          description: цель со слов клиента
        okved:
          type: string
          nullable: true
          pattern: ^\d{2}(\.\d{1,2}){0,2}$
          example: '56.30'
          description: основной ОКВЭД компании из ЕГРЮЛ; есть — проверяется соответствие цели деятельности (M33)
    PurposeResponse:
      type: object
      required:
      - status
      - purpose
      - applicable
      - generatedBy
      - matchedKeywords
      properties:
        purpose:
          $ref: '#/components/schemas/Purpose'
        applicable:
          type: boolean
          description: false — продукт цель не учитывает (овердрафт)
        generatedBy:
          type: string
          enum:
          - KEYWORDS
          - LLM
        matchedKeywords:
          type: array
          items:
            type: string
          description: совпавшие корни слов — для объяснения
        reason:
          type: string
          nullable: true
          maxLength: 500
          description: краткое объяснение LLM, если решала она; `null` — решил словарь
        status:
          $ref: '#/components/schemas/PurposeStatus'
        evidence:
          type: string
          nullable: true
          maxLength: 200
          description: дословная цитата из цели клиента, на которой LLM основала ответ
        violation:
          type: string
          nullable: true
          enum:
          - FORMAT
          - NO_EVIDENCE
          - EVIDENCE_NOT_IN_GOAL
          - GENERIC_EVIDENCE
          - UNCERTAIN_REASON
          - MANIPULATION
          - null
          description: 'какое правило ответов нарушила LLM: `FORMAT` — ответ не по схеме (статус `UNAVAILABLE`);
            `MANIPULATION` — клиент пытается управлять проверкой и цель не названа явно, LLM не вызывали (статус `UNCLEAR`);
            `NO_EVIDENCE` — нет цитаты; `EVIDENCE_NOT_IN_GOAL` — цитаты нет в тексте клиента; `GENERIC_EVIDENCE` — в цитате только общие слова
            («на развитие бизнеса»), предмета покупки нет; `UNCERTAIN_REASON` — в
            обосновании сомнение, а ответ уверенный (статус `UNCLEAR`)'
        llm:
          $ref: '#/components/schemas/LlmMeta'
        profile:
          allOf:
          - $ref: '#/components/schemas/ProfileCheck'
          nullable: true
          description: проверка цели против деятельности компании (M33); `null` — `okved` не передан
    ProfileCheck:
      type: object
      required:
      - okved
      - activity
      - status
      properties:
        okved:
          type: string
          example: '26.20'
        activity:
          type: string
          nullable: true
          description: класс ОКВЭД из `ml/okved.yaml`; `null` — класс неизвестен
          example: ОКВЭД 26.20 — Производство компьютеров, электронных и оптических изделий
        status:
          type: string
          enum:
          - FITS
          - DOES_NOT_FIT
          - UNCLEAR
          - NOT_CHECKED
        reason:
          type: string
          nullable: true
          description: объяснение LLM
        evidence:
          type: string
          nullable: true
          description: цитата из цели клиента — предмет покупки
        violation:
          type: string
          nullable: true
          enum:
          - FORMAT
          - NO_EVIDENCE
          - EVIDENCE_NOT_IN_GOAL
          - UNIVERSAL_PURCHASE
          - UNCERTAIN_REASON
          - null
          description: '`UNIVERSAL_PURCHASE` — LLM ответила «не похоже», но цель — трата, нужная любому бизнесу (итог `FITS`);
            `NO_EVIDENCE`, `EVIDENCE_NOT_IN_GOAL`, `UNCERTAIN_REASON` — «не похоже» без цитаты или с сомнением (итог `UNCLEAR`);
            `FORMAT` — ответ не по схеме (итог `NOT_CHECKED`)'
        llm:
          $ref: '#/components/schemas/LlmMeta'
    SpotType:
      type: string
      enum:
      - NO_DATA
      - ANOMALY
      - DOCUMENT
      - STOP_FACTOR
      - COLLATERAL
    SpotStatus:
      type: string
      enum:
      - OPEN
      - ON_REVIEW
      - CLOSED
    SummarySpot:
      type: object
      required:
      - spotId
      - type
      - title
      - status
      properties:
        spotId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/SpotType'
        title:
          type: string
          maxLength: 300
        status:
          $ref: '#/components/schemas/SpotStatus'
        pricePp:
          type: number
          nullable: true
        answer:
          type: string
          nullable: true
          maxLength: 2000
          description: ответ клиента по пятну
    SummaryRequest:
      type: object
      required:
      - productCode
      - amount
      - termMonths
      - rateFrom
      - rateTo
      - approveMax
      properties:
        productCode:
          $ref: '#/components/schemas/ProductCode'
        amount:
          type: integer
          format: int64
          minimum: 1
          description: копейки
        termMonths:
          type: integer
          minimum: 1
        goal:
          type: string
          nullable: true
          maxLength: 1000
        rateFrom:
          type: number
          description: из последнего `/score`
        rateTo:
          type: number
        approveMax:
          type: number
        spots:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/SummarySpot'
        facts:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/FactRef'
        existingPayment:
          type: integer
          format: int64
          minimum: 0
          default: 0
          description: 'платежи по действующим кредитам из последнего `/score` (`policy.existingPayment`), копейки в месяц.
            Больше 0 — сводка второй строкой сообщает о них: сначала вилка, потом эта строка, затем пятна. Строку добавляют
            правила, а не LLM, поэтому она есть и в `generatedBy = LLM`'
        bankPayment:
          type: integer
          format: int64
          minimum: 0
          default: 0
          description: 'часть `existingPayment` — точные платежи по договорам нашего банка (`bankPayment` из запроса `/score`),
            копейки в месяц; остальное — условная оценка по кредитам в БКИ'
          description: факты-источники в виде готовых подписей; `spotId` — к какому пятну относится
    FactRef:
      type: object
      required:
      - source
      - label
      properties:
        source:
          type: string
          maxLength: 32
          example: OFD
        label:
          type: string
          maxLength: 300
          example: выручка 2026-03 — 830 000 ₽
        spotId:
          type: string
          format: uuid
          nullable: true
    SummaryItem:
      type: object
      required:
      - text
      - facts
      properties:
        text:
          type: string
        facts:
          type: array
          items:
            $ref: '#/components/schemas/FactRef'
    UnderwritingSummary:
      type: object
      required:
      - generatedBy
      - items
      properties:
        generatedBy:
          type: string
          enum:
          - LLM
          - TEMPLATE
        items:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/SummaryItem'
        llm:
          $ref: '#/components/schemas/LlmMeta'
    PurposeStatus:
      type: string
      enum:
      - DECIDED
      - UNCLEAR
      - UNAVAILABLE
      - NOT_APPLICABLE
      description: '`UNCLEAR` — ответ получен, но цель непонятна; `UNAVAILABLE` — ответа LLM нет: это не повод отказать
        клиенту, ответ уходит на проверку андеррайтеру'
    LlmMeta:
      type: object
      nullable: true
      description: 'Версии, при которых получен ответ LLM, — для воспроизводимости. `null` — LLM не использовалась. Декодирование
        жадное (temperature 0, top_k 1, seed 42, num_ctx 4096); модель сверяется по digest (`OLLAMA_MODEL_DIGEST`), при
        расхождении LLM не используется.'
      required:
      - model
      - digest
      - promptVersion
      - cached
      properties:
        model:
          type: string
          example: qwen3:4b
        digest:
          type: string
          example: 359d7dd4bcdab3d86b87d73ac27966f4dbb9f5efdfcc75d34a8764a09474fae7
        promptVersion:
          type: string
          description: первые 12 символов sha256 от промпта, схемы ответа и параметров декодирования
          example: bba46b2556f0
        cached:
          type: boolean
          description: ответ взят из кеша вердиктов (M02). Первый ответ LLM на вход запоминается навсегда (ключ — модель,
            digest, промпт, схема и параметры декодирования); повторный вызов отдаёт его без обращения к модели, в том числе
            после перезапуска и при выключенной Ollama, если модель закреплена по digest
    LlmHealth:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - disabled
          - warming
          - ready
          - unavailable
        model:
          type: string
          nullable: true
        digest:
          type: string
          nullable: true
        cachedVerdicts:
          type: integer
          nullable: true
    AnswerCode:
      type: string
      enum:
      - RENOVATION
      - SEASONAL
      - CLIENT_LOST
      - OTHER
    AnomalyRef:
      type: object
      required:
      - code
      - month
      - changePct
      properties:
        code:
          type: string
          enum:
          - REVENUE_DROP
          - REVENUE_SPIKE
        month:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
        changePct:
          type: integer
        source:
          allOf:
          - $ref: '#/components/schemas/SourceCode'
          nullable: true
          description: источник ряда с аномалией; для verify нужен, если рядов несколько
    AnswerClassifyRequest:
      type: object
