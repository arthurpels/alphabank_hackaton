openapi: 3.0.3
info:
  title: Скоринг-сервис ml/ — внутренний API
  version: 0.1.0
  description: 'Контракт backend ↔ ml (T10). Его вызывает только бэкенд, наружу сервис не открыт.


    - Модель и правила — `docs/scoring-model.md`, `ml/scoring_rules.yaml`, калькулятор `ml/scoring_calc.py`.

    - Сервис только считает: в моки и в БД не ходит. Ответы моков в входы факторов переводит бэкенд (T19).

    - Строго детерминированно: одинаковый запрос и одна `rulesVersion` — одинаковый ответ. Поэтому дата расчёта `asOf` передаётся
    во входе, а не берётся из часов сервиса.

    - Решение по заявке принимает бэкенд (статусная машина, T31) по `rateFrom`, `rateTo`, `thresholds`, `policy` и `stopFactors`.

    - Авторизации нет: сервис доступен только внутри сети compose.

    - Деньги — в копейках (`integer`), ставки и вклады — в процентах и процентных пунктах (`number`).

    - Фактор неизвестен — поле входа равно `null`.

    - Примеры посчитаны калькулятором T06 по персонажам из `docs/synthetic-data.md` на 23.10.2026.'
servers:
- url: http://ml:8001
  description: внутри docker compose
- url: http://localhost:8001
  description: с хоста
security: []
tags:
- name: scoring
  description: вилка, сетка иных условий, аномалии
- name: llm
  description: разбор цели и сводка андеррайтеру; без LLM — словарь и шаблон
