  /purpose:
    post:
      operationId: classifyPurpose
      tags:
      - llm
      summary: Разбор цели кредита
      description: 'Соответствует ли цель со слов клиента продукту — значение для `/score.purpose`. Сначала словарь корней слов
        (`ml/scoring_rules.yaml`, `purpose_keywords`): признаки только запрошенного продукта — `MATCH`, только другого — `MISMATCH`.
        Если словарь не решает (признаки обоих или ни одного) — спрашиваем LLM. `status` различает исходы: `DECIDED` —
        цель определена; `UNCLEAR` — цель пустая или LLM ответила «нельзя понять» (просим клиента уточнить);
        `UNAVAILABLE` — нужна LLM, но она выключена, не ответила, ответила не по формату или digest модели не совпал
        (ответ клиента уходит андеррайтеру, отказывать клиенту нельзя); `NOT_APPLICABLE` — продукт цель не учитывает.
        При ответе LLM в `llm` — модель, digest и версия промпта. `generatedBy` показывает, кто решил, `reason` — объяснение LLM. Пустая цель — `null` без LLM. Для продуктов
        без словаря (овердрафт) — `applicable = false`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurposeRequest'
            examples:
              coffee:
                summary: ООО «Кофейня» — цель совпадает с продуктом
                value:
                  productCode: EQUIPMENT
                  goal: 2 кофемашины и витрина для второй точки
              mismatch:
                summary: Станок за счёт оборотного кредита — цель не совпадает
                value:
                  productCode: WORKING_CAPITAL
                  goal: покупка станка с ЧПУ
              ambiguous:
                summary: Признаки обоих продуктов — без LLM цель не определена
                value:
                  productCode: WORKING_CAPITAL
                  goal: закупка оборудования для цеха
      responses:
        '200':
          description: результат разбора
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurposeResponse'
              examples:
                coffee:
                  summary: ООО «Кофейня» — цель совпадает с продуктом
                  value:
                    status: DECIDED
                    purpose: MATCH
                    applicable: true
                    generatedBy: KEYWORDS
                    matchedKeywords:
                    - кофемашин
                    - витрин
                    reason: null
                    llm: null
                mismatch:
                  summary: Станок за счёт оборотного кредита — цель не совпадает
                  value:
                    status: DECIDED
                    purpose: MISMATCH
                    applicable: true
                    generatedBy: KEYWORDS
                    matchedKeywords:
                    - станк
                    reason: null
                    llm: null
                ambiguous:
                  summary: Признаки обоих продуктов — без LLM цель не определена
                  value:
                    status: UNAVAILABLE
                    purpose: null
                    applicable: true
                    generatedBy: KEYWORDS
                    matchedKeywords:
                    - закуп
                    - оборудован
                    reason: null
                    llm: null
        '422':
          $ref: '#/components/responses/ValidationError'
  /summary:
    post:
      operationId: summarizeForUnderwriter
      tags:
      - llm
      summary: Сводка для андеррайтера
      description: '3–5 выводов для карточки андеррайтера; форма ответа совпадает с `UnderwritingSummary` публичного API (`GET
        /underwriting/applications/{id}/summary`), бэкенд отдаёт её как есть. При `LLM_SUMMARY_ENABLED=true` (вместе с `LLM_ENABLED`) и
        непустом `facts` выводы пишет LLM: у каждого должны быть ссылки на переданные факты, выводы без них и ссылки на чужие факты отбрасываются. LLM недоступна,
        не уложилась в `LLM_TIMEOUT_SECONDS` или ответила не по формату — шаблон: вилка относительно порога, открытые пятна
        по убыванию цены, факты без пятна по источникам (`generatedBy = TEMPLATE`). Решение LLM не предлагает.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SummaryRequest'
            examples:
              builder:
                summary: ИП Петров на андеррайтинге — шаблонная сводка (LLM выключена)
                value:
                  productCode: WORKING_CAPITAL
                  amount: 300000000
                  termMonths: 12
                  goal: закупка материалов под договор подряда на склад
                  rateFrom: 17.0
                  rateTo: 24.5
                  approveMax: 21.0
                  spots:
                  - spotId: 5f0c3e2a-0000-4000-8000-000000000001
                    type: NO_DATA
                    title: Продажи не видны
                    status: OPEN
                    pricePp: 3.5
                  - spotId: 5f0c3e2a-0000-4000-8000-000000000002
                    type: DOCUMENT
                    title: Договор с генподрядчиком
                    status: ON_REVIEW
                    pricePp: 3.5
                    answer: Приложил договор на 9,6 млн
                  - spotId: 5f0c3e2a-0000-4000-8000-000000000003
                    type: COLLATERAL
                    title: Залог или поручительство
                    status: OPEN
                    pricePp: 1.5
                  - spotId: 5f0c3e2a-0000-4000-8000-000000000004
                    type: NO_DATA
                    title: Цель кредита
                    status: CLOSED
                    pricePp: 1.5
                  facts:
                  - source: BKI
                    label: кредитный рейтинг 655, просрочек за 12 мес. нет
                  - source: EGRUL
                    label: ИП зарегистрирован 01.03.2024
                  - source: DOCUMENT
                    label: договор подряда на 9 600 000 ₽, 12 мес.
                    spotId: 5f0c3e2a-0000-4000-8000-000000000002
      responses:
        '200':
          description: сводка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnderwritingSummary'
              examples:
                builder:
                  summary: ИП Петров на андеррайтинге — шаблонная сводка (LLM выключена)
                  value:
                    generatedBy: TEMPLATE
                    llm: null
                    items:
                    - text: Вилка 17,0–24,5 % пересекает порог одобрения 21,0 % — решение зависит от открытых пятен.
                      facts: []
                    - text: '«Договор с генподрядчиком» — ответ ждёт проверки, до 3,5 п.п. Ответ клиента: «Приложил договор
                        на 9,6 млн».'
                      facts:
                      - source: DOCUMENT
                        label: договор подряда на 9 600 000 ₽, 12 мес.
                        spotId: 5f0c3e2a-0000-4000-8000-000000000002
                    - text: «Продажи не видны» — не закрыто, до 3,5 п.п.
                      facts: []
                    - text: «Залог или поручительство» — не закрыто, до 1,5 п.п.
                      facts: []
        '422':
          $ref: '#/components/responses/ValidationError'
  /health/llm:
    get:
      operationId: llmHealth
      tags:
      - llm
      summary: Состояние локальной LLM
      description: '`disabled` — LLM выключена (`LLM_ENABLED=false`); `warming` — модель загружается в память после старта;
        `ready` — модель на месте (digest совпал) и прогрета; `unavailable` — Ollama не отвечает, модели нет или digest не
        совпал, прогрев повторяется каждые 10 секунд. `cachedVerdicts` — сколько ответов LLM запомнено (M02).'
      responses:
        '200':
          description: состояние
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmHealth'
              examples:
                disabled:
                  summary: LLM выключена
                  value:
                    status: disabled
                    model: null
                    digest: null
                    cachedVerdicts: null
                ready:
                  summary: модель прогрета, 12 ответов запомнено
                  value:
                    status: ready
                    model: qwen3:4b
                    digest: 359d7dd4bcdab3d86b87d73ac27966f4dbb9f5efdfcc75d34a8764a09474fae7
                    cachedVerdicts: 12
  /health:
    get:
      operationId: health
      tags:
      - scoring
      summary: Проверка для healthcheck в compose
      responses:
        '200':
          description: сервис жив
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
components:
  responses:
    ValidationError:
      description: некорректный вход (стандартный ответ FastAPI)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
  schemas:
    ProductCode:
      type: string
      enum:
      - WORKING_CAPITAL
      - EQUIPMENT
      - OVERDRAFT
    SourceCode:
      type: string
      enum:
      - BKI
      - EGRUL
      - FNS
      - OFD
      - MARKETPLACE
      - ACQUIRING
      - REPUTATION
    FactorCode:
      type: string
      enum:
      - credit_history
      - business_age
      - tax_discipline
      - debt_load
      - revenue_stability
      - purpose
      - collateral
    StopFactorCode:
      type: string
      enum:
      - LIQUIDATION
      - YOUNG_BUSINESS
      - NEW_DIRECTOR
      - MASS_ADDRESS
      - TAX_DEBT
      - BKI_OVERDUE
    Stability:
      type: string
      nullable: true
      description: '`null` — рядов нет, фактор неизвестен; `ANOMALY_OPEN` — аномалия найдена, ответа нет (тоже неизвестен);
        `CLEAN` — аномалий нет; `EXPLAINED` — объяснение принято; `DOCUMENT` — выручка подтверждена только договором; `REJECTED`
        — объяснение отклонено.'
      enum:
      - CLEAN
      - ANOMALY_OPEN
      - EXPLAINED
      - DOCUMENT
      - REJECTED
      - null
    Purpose:
      type: string
      nullable: true
      description: '`null` — цель не описана; `MATCH` — цель соответствует продукту; `MISMATCH` — не соответствует.'
      enum:
      - MATCH
      - MISMATCH
      - null
    Collateral:
      type: string
      nullable: true
      description: '`null` — клиент ещё не решил; `GUARANTEE` / `PLEDGE` — поручительство или залог; `DECLINED` — отказался.'
      enum:
      - GUARANTEE
      - PLEDGE
      - DECLINED
      - null
    ScoreRequest:
      type: object
      required:
      - asOf
      - productCode
      - amount
      - termMonths
      - egrulStatus
      - registeredAt
      - directorSince
      - massAddress
      - creditScore
      - delinq12m
      - bkiCurrentOverdue
      - taxDebt
      - unfiledReports
      properties:
        asOf:
          type: string
          format: date
          description: 'дата расчёта: от неё считаются возраст бизнеса и срок директора'
        productCode:
          $ref: '#/components/schemas/ProductCode'
        amount:
          type: integer
          format: int64
          minimum: 1
          description: сумма, копейки
        termMonths:
          type: integer
          minimum: 1
        egrulStatus:
          type: string
          description: ЕГРЮЛ `status`
          example: ACTIVE
        registeredAt:
          type: string
          format: date
          description: ЕГРЮЛ `registered_at`
        directorSince:
          type: string
          format: date
          description: ЕГРЮЛ `director.appointed_at`
        massAddress:
          type: boolean
          description: ЕГРЮЛ `address.is_mass`
        creditScore:
          type: integer
          description: БКИ `credit_score`
        delinq12m:
          type: integer
          minimum: 0
          description: БКИ `delinquencies.last_12m`
        bkiCurrentOverdue:
          type: integer
          minimum: 0
          description: БКИ `delinquencies.current`
        taxDebt:
          type: integer
          format: int64
          minimum: 0
          description: ФНС `tax_debt.amount`, копейки
        unfiledReports:
          type: integer
          minimum: 0
          description: ФНС `unfiled_reports`
        monthlyRevenue:
          type: integer
          format: int64
          nullable: true
          minimum: 1
          description: 'среднемесячная подтверждённая выручка, копейки: ОФД `revenue`, маркетплейс `payout`, эквайринг `turnover`
            или договор (сумма / срок); при нескольких источниках — максимум. `null` — выручка не подтверждена, 0 не передаём'
        stability:
          $ref: '#/components/schemas/Stability'
        purpose:
          $ref: '#/components/schemas/Purpose'
        collateral:
          $ref: '#/components/schemas/Collateral'
    Thresholds:
      type: object
      required:
      - approveMax
      - rejectMin
      properties:
        approveMax:
          type: number
          description: правый край ≤ — автоодобрение
        rejectMin:
          type: number
          description: левый край ≥ — отказ
    Factor:
      type: object
      required:
      - code
      - title
      - applicable
      - known
      properties:
        code:
          $ref: '#/components/schemas/FactorCode'
        title:
          type: string
        applicable:
          type: boolean
          description: false — фактор не применяется к продукту (у овердрафта `purpose` и `collateral`)
        known:
          type: boolean
        value:
          type: number
          nullable: true
          description: вклад, п.п., если фактор известен
        best:
          type: number
          nullable: true
          description: лучший вклад, если фактор неизвестен
        worst:
          type: number
          nullable: true
          description: худший вклад, если фактор неизвестен
        spotPricePp:
          type: number
          nullable: true
          description: цена пятна = worst − best
    StopFactor:
      type: object
      required:
      - code
      - removable
      properties:
        code:
          $ref: '#/components/schemas/StopFactorCode'
        removable:
          type: boolean
        closeMethod:
          type: string
          nullable: true
          enum:
          - PAY
          - null
          description: как клиент устраняет; `null` у неустранимого
    Policy:
      type: object
      required:
      - amountInRange
      - ok
      properties:
        metric:
          type: string
          nullable: true
          enum:
          - PTI
          - LIMIT_SHARE
          - null
          description: '`PTI` — платёж / выручка; `LIMIT_SHARE` — лимит овердрафта / выручка; `null` — выручка неизвестна'
        value:
          type: number
          nullable: true
          description: доля, например 0.347
        cap:
          type: number
          nullable: true
          description: допустимая доля продукта
        amountInRange:
          type: boolean
        ok:
          type: boolean
    ScoreResponse:
      type: object
      required:
      - rulesVersion
      - productCode
      - rateFrom
      - rateTo
      - thresholds
      - factors
      - stopFactors
      - policy
      - passes
      properties:
        rulesVersion:
          type: string
          description: версия YAML-правил — пишется в FORK_SNAPSHOT и DECISION
        productCode:
          $ref: '#/components/schemas/ProductCode'
        rateFrom:
          type: number
          description: левый край, %
        rateTo:
          type: number
          description: правый край, %
        thresholds:
          $ref: '#/components/schemas/Thresholds'
        factors:
          type: array
          items:
            $ref: '#/components/schemas/Factor'
        stopFactors:
          type: array
          items:
            $ref: '#/components/schemas/StopFactor'
        policy:
          $ref: '#/components/schemas/Policy'
        passes:
          type: boolean
          description: policy.ok и rateTo ≤ approveMax
    Offer:
      type: object
      required:
      - productCode
      - amount
      - termMonths
      - rateFrom
      - rateTo
      - policy
      properties:
        productCode:
          $ref: '#/components/schemas/ProductCode'
        amount:
          type: integer
          format: int64
          description: копейки
        termMonths:
          type: integer
        collateralType:
          type: string
          nullable: true
          enum:
          - GUARANTEE
          - null
          description: '`null` — без обеспечения'
        rateFrom:
          type: number
        rateTo:
          type: number
        policy:
          $ref: '#/components/schemas/Policy'
    OfferGridResponse:
      type: object
      required:
      - rulesVersion
      - offers
      properties:
        rulesVersion:
          type: string
        offers:
          type: array
          items:
            $ref: '#/components/schemas/Offer'
    SeriesPoint:
      type: object
      required:
      - month
      - value
      properties:
        month:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
          example: 2026-03
        value:
          type: integer
          format: int64
          minimum: 0
          description: копейки
    Series:
      type: object
      required:
      - source
      - points
      properties:
        source:
          $ref: '#/components/schemas/SourceCode'
        points:
          type: array
          items:
            $ref: '#/components/schemas/SeriesPoint'
    AnomaliesRequest:
      type: object
      required:
      - series
      properties:
        series:
          type: array
          items:
            $ref: '#/components/schemas/Series'
    AnswerOption:
      type: object
      required:
      - code
      - label
      properties:
        code:
          type: string
        label:
          type: string
    Anomaly:
      type: object
      required:
      - code
      - source
      - month
      - changePct
      - title
      - clientHint
      - answerOptions
      properties:
        code:
          type: string
          enum:
          - REVENUE_DROP
