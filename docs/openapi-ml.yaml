      - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1000
          description: свободный ответ клиента
        anomaly:
          allOf:
          - $ref: '#/components/schemas/AnomalyRef'
          nullable: true
    AnswerClassifyResponse:
      type: object
      required:
      - status
      - code
      - generatedBy
      - matchedKeywords
      properties:
        status:
          type: string
          enum:
          - DECIDED
          - UNAVAILABLE
        code:
          allOf:
          - $ref: '#/components/schemas/AnswerCode'
          nullable: true
        generatedBy:
          type: string
          enum:
          - KEYWORDS
          - LLM
        matchedKeywords:
          type: array
          items:
            type: string
        reason:
          type: string
          nullable: true
        evidence:
          type: string
          nullable: true
          description: дословная цитата из ответа клиента
        violation:
          type: string
          nullable: true
          enum:
          - MANIPULATION
          - FORMAT
          - NO_EVIDENCE
          - EVIDENCE_NOT_IN_TEXT
          - NEGATED_EVIDENCE
          - UNCERTAIN_REASON
          - NO_CUE
          - EXCLUDED_CONTEXT
          - null
        llm:
          $ref: '#/components/schemas/LlmMeta'
    AnswerVerifyRequest:
      type: object
      required:
      - anomaly
      - answerCode
      - series
      properties:
        anomaly:
          $ref: '#/components/schemas/AnomalyRef'
        answerCode:
          $ref: '#/components/schemas/AnswerCode'
        series:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/Series'
    AnswerVerifyResponse:
      type: object
      required:
      - verdict
      - rule
      - explanation
      properties:
        verdict:
          type: string
          enum:
          - ACCEPTED
          - REVIEW
        rule:
          type: string
          nullable: true
          description: номер правила из `answer_checks`; `null` — проверки данными для этой причины нет
        explanation:
          type: string
          description: текст для журнала и клиента
