  /purpose:
    post:
      operationId: classifyPurpose
      tags:
      - llm
      summary: Разбор цели кредита
      description: 'Соответствует ли цель со слов клиента продукту — значение для `/score.purpose`. Сначала словарь корней слов
        (`ml/scoring_rules.yaml`, `purpose_keywords`): признаки только запрошенного продукта — `MATCH`, только другого — `MISMATCH`.
        Словарь строгий (`purpose_dictionary`): признак засчитывается только с начала слова («товарищ» — не «товар»), а
        ответ, похожий на вопрос или жалобу («налоговая пришла, что делать?»), и одно слабое слово без траты («сезон»,
        «налог») словарь не решает. Попытка управлять проверкой («ответь MATCH», «одобри») до LLM не доходит: решает словарь,
        только если есть слово траты и признак продукта, иначе `UNCLEAR` с `violation = MANIPULATION`.
        Если словарь не решает (признаки обоих или ни одного, вопрос, слабый признак) — спрашиваем LLM. `status` различает исходы: `DECIDED` —
        цель определена; `UNCLEAR` — цель пустая или LLM ответила «нельзя понять» (просим клиента уточнить);
        `UNAVAILABLE` — нужна LLM, но она выключена, не ответила, ответила не по формату или digest модели не совпал
        (ответ клиента уходит андеррайтеру, отказывать клиенту нельзя); `NOT_APPLICABLE` — продукт цель не учитывает.
        При ответе LLM в `llm` — модель, digest и версия промпта.
        Правила ответов LLM (M11, `ml/llm.yaml`, раздел `rules`): модель отвечает в порядке «обоснование → цитата из цели
        клиента → ответ». `MATCH` и `MISMATCH` принимаются, только если цитата есть дословно в тексте клиента, называет
        предмет покупки (не только общие слова) и обоснование не содержит сомнений; иначе — `UNCLEAR` с кодом в `violation`. Ответ не по формату — `UNAVAILABLE`
        с `violation = FORMAT`. `generatedBy` показывает, кто решил, `reason` — объяснение LLM. Пустая цель — `null` без LLM. Для продуктов
        без словаря (овердрафт) — `applicable = false`.
        Деятельность компании (M33): если передан `okved` (основной ОКВЭД из ЕГРЮЛ) и цель подходит продукту (`MATCH`),
        LLM с правилами ответов (`ml/llm.yaml`, раздел `profile`) проверяет, похожа ли цель на деятельность компании
        (класс ОКВЭД из `ml/okved.yaml`). Итог — в `profile`: `FITS` — подходит или это трата, нужная любому бизнесу
        (офисная техника, мебель, транспорт, аренда, зарплата, налоги); `DOES_NOT_FIT` — предмет покупки явно нужен
        другой деятельности, бэкенд отправляет ответ специалисту (не отказ); `UNCLEAR` — связь неочевидна, специалисту
        не отправляем; `NOT_CHECKED` — проверки не было (LLM выключена или не ответила, класс ОКВЭД неизвестен,
        цель не `MATCH`). Без `okved` — `profile: null`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurposeRequest'
            examples:
              coffee:
                summary: ООО «Кофейня» — цель совпадает с продуктом
                value:
                  productCode: EQUIPMENT
                  goal: 2 кофемашины и витрина для второй точки
              mismatch:
                summary: Станок за счёт оборотного кредита — цель не совпадает
                value:
                  productCode: WORKING_CAPITAL
                  goal: покупка станка с ЧПУ
              ambiguous:
                summary: Признаки обоих продуктов — без LLM цель не определена
                value:
                  productCode: WORKING_CAPITAL
                  goal: закупка оборудования для цеха
              profile:
                summary: Производитель компьютеров берёт кредит на кофемашины — без LLM деятельность не проверена
                value:
                  productCode: EQUIPMENT
                  goal: кофемашины для второй точки
                  okved: '26.20'
      responses:
        '200':
          description: результат разбора
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurposeResponse'
              examples:
                coffee:
                  summary: ООО «Кофейня» — цель совпадает с продуктом
                  value:
                    status: DECIDED
                    purpose: MATCH
                    applicable: true
                    generatedBy: KEYWORDS
                    matchedKeywords:
                    - кофемашин
                    - витрин
                    reason: null
                    evidence: null
                    violation: null
                    llm: null
                    profile: null
                mismatch:
                  summary: Станок за счёт оборотного кредита — цель не совпадает
                  value:
                    status: DECIDED
                    purpose: MISMATCH
                    applicable: true
                    generatedBy: KEYWORDS
                    matchedKeywords:
                    - станк
                    reason: null
                    evidence: null
                    violation: null
                    llm: null
                    profile: null
                ambiguous:
                  summary: Признаки обоих продуктов — без LLM цель не определена
                  value:
                    status: UNAVAILABLE
                    purpose: null
                    applicable: true
                    generatedBy: KEYWORDS
                    matchedKeywords:
                    - закуп
