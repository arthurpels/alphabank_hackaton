spring:
  application:
    name: backend
  jackson:
    default-property-inclusion: always
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  http:
    client:
      connect-timeout: 1500ms
      read-timeout: 4000ms
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/credit_pipeline}
    username: ${SPRING_DATASOURCE_USERNAME:alphabank}
    password: ${SPRING_DATASOURCE_PASSWORD:alphabank}
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  paths-to-match: /api/**

app:
  ml-url: ${ML_URL:http://localhost:8001}
  mocks-url: ${MOCKS_URL:http://localhost:8002}
  documents-dir: ${DOCUMENTS_DIR:/data/documents}
  cors-allowed-origins: http://localhost:5173
  external:
    retry-attempts: 3
    retry-backoff-ms: 200
